    date: 2026-06-12
    checked_by: Security Team

  # ── Platform / runtime ───────────────────────────────────────────────────

  lateral-movement-shared-runtime@docker-host:
    status: accepted
    justification: >
      The single docker-host runtime is inherent to the self-hosted
      deployment tier (compose on one VM). Containers run unprivileged with
      no docker socket mounts (see mixed-targets acceptance VAULT-95); the
      AWS/ECS deployment removes the shared runtime entirely.
    accepted_until: 2026-12-31
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  container-platform-escape@ecs-platform:
    status: accepted
    justification: >
      ECS on Fargate provides VM-level task isolation managed by AWS; no
      privileged containers or host mounts are configured. Residual platform
      escape risk is accepted as a managed-service dependency.
    accepted_until: 2027-06-01
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  cloud-container-registry-public@container-registry:
    status: false-positive
    justification: >
      ECR repositories are private with IAM-scoped pull/push; no public
      registry policy exists. The internet flag on the asset models the
      managed endpoint, not anonymous accessibility.
    date: 2026-06-12
    checked_by: Security Team

  cloud-serverless-overpermissive-role@lambda-notifier:
    status: in-progress
    justification: >
      Lambda execution role to be scoped from ses:* to ses:SendEmail on the
      verified identity ARN plus the specific SQS queue ARN.
    ticket: VAULT-153
    date: 2026-06-12
    checked_by: Security Team

