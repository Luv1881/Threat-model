    ticket: VAULT-150
    date: 2026-06-12
    checked_by: Security Team

  # ── Resilience / recovery programme (OCTAVE asset-care findings) ─────────

  octave-no-backup@*:
    status: in-progress
    justification: >
      Backup wave: nightly pg_dump with restore verification, Redis RDB
      snapshots (cache data is reconstructible), MinIO bucket replication,
      S3 versioning, and vector-store re-embedding runbook.
    ticket: VAULT-164
    date: 2026-06-12
    checked_by: Security Team

  octave-no-recovery-plan@*:
    status: in-progress
    justification: >
      Disaster-recovery runbook (RTO/RPO targets per datastore, restore
      drills) is drafted and pending review alongside the VAULT-164 backup
      implementation.
    ticket: VAULT-165
    date: 2026-06-12
    checked_by: Security Team

  octave-no-access-control@*:
    status: in-progress
    justification: >
      Least-privilege pass on datastore access: dedicated PostgreSQL roles
      per service, Redis ACLs, MinIO policy per bucket prefix, RDS/S3
      security-group and bucket-policy review.
    ticket: VAULT-163
    date: 2026-06-12
    checked_by: Security Team

  octave-third-party-exposure@*:
    status: accepted
    justification: >
      Dependence on managed third parties (AWS RDS/S3, MinIO distribution)
      is a deliberate build-vs-buy decision; vendor security posture was
      assessed at selection. Re-confirm at expiry.
    accepted_until: 2027-06-01
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  cloud-object-storage-no-versioning@*:
    status: in-progress
    justification: >
      S3 bucket versioning + MinIO object locking are part of the VAULT-164
      backup/recovery wave (protects against ransomware-style overwrite and
      accidental deletion).
    ticket: VAULT-164
    date: 2026-06-12
    checked_by: Security Team

