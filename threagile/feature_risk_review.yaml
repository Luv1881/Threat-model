# Risk-review wave 2026-06-12 — full triage of previously-unchecked findings
# across all 9 methodology runs (STRIDE, LINDDUN, PASTA, VAST, Cloud-Native,
# Supply-Chain, AI/ML, OCTAVE, Trike).
#
# Conventions:
#   - Wildcard entries (rule-id@*) apply to every matching generated risk that
#     has no direct (non-wildcard) tracking entry of its own.
#   - "accepted" entries carry accepted_until/accepted_by (acceptance-expiry
#     workflow): the analysis FAILS once the date passes, forcing re-review.
#     VaultNote contains intentional misconfigurations kept for security
#     training; those acceptances expire 2026-12-31 to force re-confirmation.
#   - "false-positive" entries explain why the detection logic does not apply.
#   - "in-progress" entries reference a VAULT-* remediation ticket.

risk_tracking:

  # ── Transport encryption (intentional misconfiguration cluster) ──────────

  unencrypted-communication@*:
    status: in-progress
    justification: >
      Plaintext HTTP between API server and PostgreSQL/Redis/MinIO inside
      backend-net is one of the model's intentional misconfigurations. TLS for
      all internal data-plane connections is the same effort already tracked
      for the PII-disclosure findings (VAULT-117).
    ticket: VAULT-117
    date: 2026-06-12
    checked_by: Security Team

  octave-unencrypted-transport@*:
    status: in-progress
    justification: >
      OCTAVE view of the same internal plaintext-transport gap covered by
      VAULT-117 (TLS for PostgreSQL, Redis, MinIO, vector store, and the
      RDS/S3 in-VPC variants).
    ticket: VAULT-117
    date: 2026-06-12
    checked_by: Security Team

  # ── Encryption at rest (intentional misconfiguration cluster) ────────────

  identifying-pii-stored-unencrypted@*:
    status: accepted
    justification: >
      Intentional misconfiguration: encryption at rest is deliberately absent
      on PostgreSQL/Redis/MinIO/vector store (and disabled on RDS/S3 in the
      Terraform) for training purposes. Production deployments require the
      VAULT-110/VAULT-89 encryption work before launch.
    accepted_until: 2026-12-31
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  unencrypted-asset@*:
    status: accepted
    justification: >
      Same intentional encryption-at-rest gap as the LINDDUN PII findings:
      RDS (storage_encrypted=false), S3 (no SSE), and Redis are deliberately
      unencrypted in this training environment. Direct entries exist for
      postgresql-db and minio-storage; this acceptance covers the remaining
      managed-service variants until the next review.
    accepted_until: 2026-12-31
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  cloud-object-storage-no-encryption@minio-storage:
    status: in-progress
    justification: >
      MinIO SSE-S3 enablement is already in flight as part of VAULT-110
      (alongside default-credential rotation); this is the cloud-native pack's
      view of the same gap.
    ticket: VAULT-110
    date: 2026-06-12
    checked_by: Security Team

  # ── Authentication on internal links (intentional misconfiguration) ──────

  missing-authentication@*:
    status: accepted
    justification: >
      Intentional misconfiguration: the Nginx→API plaintext hop carries no
      link-level authentication (end-user JWTs are validated by the API
      server itself), and the API-Gateway→ECS route relies on the gateway
      JWT authorizer rather than mutual auth. Kept for training; production
      hardening (mTLS / signed service identity) re-evaluated at expiry.
    accepted_until: 2026-12-31
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  missing-authentication-second-factor@*:
    status: accepted
    justification: >
      MFA for end users is on the product roadmap but out of scope for the
      current release; session hardening (short-lived JWTs + Redis revocation
      list, VAULT-143) is the compensating control.
    accepted_until: 2027-03-31
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  # ── Injection / request-forgery detections (analytical review) ───────────

  sql-nosql-injection@api-server@redis-cache@api-server>redis-session-store:
    status: false-positive
    justification: >
      Redis is accessed exclusively through ioredis command methods with
      discrete arguments (no Lua scripts built from user input, no EVAL of
      concatenated strings). The injection detection keys on the datastore
      protocol and does not apply to this access pattern.
    date: 2026-06-12
    checked_by: Security Team

  server-side-request-forgery@*:
    status: false-positive
    justification: >
      Every flagged outbound call targets a static, configuration-defined
      endpoint: MinIO endpoint URL, AWS SES via SDK, ECR registry pulls by
      digest, GitHub→Actions webhooks, and fixed internal AI-service URLs.
      No user-controlled URL or hostname is ever fetched, which is the
      precondition for SSRF.
    date: 2026-06-12
    checked_by: Security Team

  path-traversal@*:
    status: in-progress
    justification: >
      MinIO object keys are server-generated UUIDs (never derived from
      user-supplied filenames) and registry pulls are by immutable digest,
      but a verification pass plus regression tests asserting the key
      construction is tracked before closing as false-positive.
    ticket: VAULT-166
    date: 2026-06-12
    checked_by: Security Team

  unguarded-direct-datastore-access@*:
    status: false-positive
    justification: >
      The API server is the identity-providing application tier; its direct
      access to its own PostgreSQL/Redis/MinIO backing stores is the standard
      three-tier pattern. The finding triggers on datastore RAA attractiveness,
      not on an actual missing guard.
    date: 2026-06-12
    checked_by: Security Team

  # ── Internet exposure review ──────────────────────────────────────────────

  unguarded-access-from-internet@api-server@aws-api-gateway@aws-api-gateway>route-to-ecs-api:
    status: accepted
    justification: >
      The API Gateway route is the designed public entry point of the AWS
      deployment; requests pass the gateway JWT authorizer and (pending
      VAULT-149 WAF work) gateway throttling. Re-review at expiry.
    accepted_until: 2027-06-01
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  unguarded-access-from-internet@*:
    status: false-positive
    justification: >
      Remaining matches are authenticated SaaS/service flows mis-detected as
      unguarded: GitHub→Actions and Actions→ECR use OIDC/registry auth, and
      the LLM-summarizer→RAG/vector-store calls are service-to-service inside
      the AI Services network (flagged only because the summarizer asset is
      internet-facing).
    date: 2026-06-12
    checked_by: Security Team

  internet-reachable-datastore@container-registry:
    status: false-positive
    justification: >
      ECR repositories are private (no public registry policy); the asset's
      internet flag models the managed-service endpoint, not public
      readability. Pull/push require AWS IAM auth.
    date: 2026-06-12
    checked_by: Security Team

  internet-reachable-datastore@vector-store:
    status: false-positive
    justification: >
      The vector store is modeled with internet: false inside the AI Services
      trust boundary; the PASTA rule flags it through the internet-facing
      LLM-summarizer caller, not through actual exposure. Network policy
      restricts ingress to the RAG pipeline and summarizer.
    date: 2026-06-12
    checked_by: Security Team

  dos-risky-access-across-trust-boundary@*:
    status: accepted
    justification: >
      Low-severity DoS exposure on the browser→nginx→API→PostgreSQL chain is
      mitigated by the existing nginx rate limiting and connection pooling;
      additional per-operation limits are the VAULT-146 effort.
    accepted_until: 2027-06-01
    accepted_by: VaultNote Security Team
    date: 2026-06-12
    checked_by: Security Team

  # ── Hardening programme ──────────────────────────────────────────────────

  missing-hardening@*:
    status: in-progress
    justification: >
      CIS benchmark hardening for PostgreSQL (self-hosted + RDS parameter
      groups) and the ECS task/host configuration is scheduled as one
      hardening wave.
    ticket: VAULT-160
    date: 2026-06-12
    checked_by: Security Team

  missing-cloud-hardening@*:
    status: in-progress
    justification: >
      CIS AWS Foundations benchmark for the AWS account, Docker Bench for the
      self-hosted docker-host, and GitHub organization security settings for
      the external CI/CD boundary are tracked as one cloud-hardening effort.
    ticket: VAULT-158
    date: 2026-06-12
    checked_by: Security Team

  missing-csp-header@nginx-proxy:
    status: in-progress
    justification: >
      Content-Security-Policy rollout for the SPA: report-only policy first,
      then enforcing (script-src 'self' + hash allowlist). Nginx config change
      staged.
    ticket: VAULT-159
    date: 2026-06-12
    checked_by: Security Team

  missing-waf@api-server:
    status: in-progress
    justification: >
      AWS WAF (managed core rule set + rate-based rules) in front of the API
      Gateway covers the AWS deployment; ModSecurity evaluation for the
      self-hosted nginx tier is part of the same ticket.
    ticket: VAULT-149
    date: 2026-06-12
    checked_by: Security Team

  cloud-api-gateway-no-waf@aws-api-gateway:
    status: in-progress
    justification: >
      Same WAF effort as missing-waf@api-server: AWS WAF web ACL association
      with the API Gateway stage.
    ticket: VAULT-149
    date: 2026-06-12
    checked_by: Security Team

  missing-vault@api-server:
    status: in-progress
    justification: >
      AWS Secrets Manager adoption for the ECS deployment and docker secrets
      for the self-hosted tier; removes env-var credential injection.
    ticket: VAULT-162
    date: 2026-06-12
    checked_by: Security Team

  missing-identity-store@nginx-proxy:
    status: false-positive
    justification: >
      User identities live in the PostgreSQL users table (modeled as the
      user-credentials data asset) with bcrypt password hashing; there is no
      separate IdP by design for this product size. The rule expects a
      dedicated identity-store asset type.
    date: 2026-06-12
    checked_by: Security Team

  missing-build-infrastructure@api-server:
    status: false-positive
    justification: >
      Build infrastructure exists and is fully modeled (source-repo,
      build-pipeline, container-registry in the External CI/CD boundary);
      the rule fires because the build assets sit outside the asset's own
      network boundary, which is exactly the GitHub-hosted topology.
    date: 2026-06-12
    checked_by: Security Team

  # ── Logging / monitoring programme ───────────────────────────────────────

  detecting-no-audit-logging@*:
