# ============================================================
# Feature: API / Auth Layer
# Components: Node.js/Express API Server
# Networks:   Application Network (frontend-net)
# Data:       User Credentials, Session Tokens
# ============================================================

data_assets:

  User Credentials:
    id: user-credentials
    description: >
      Email addresses and bcrypt-hashed passwords used for authentication.
      Compromise allows full account takeover.
    usage: business
    tags: []
    origin: customer
    owner: VaultNote Team
    quantity: many
    confidentiality: strictly-confidential
    integrity: critical
    availability: operational
    justification_cia_rating: >
      Credentials grant full account access. A breach leaks all users' identities
      and enables account takeover across every note and attachment.
    pii_categories: [email-address, password-hash]
    data_subject_category: customer
    lawful_basis: contract
    processing_purpose: Authentication and account management
    retention_period: "duration of account + 30 days post-deletion"

  Session Tokens:
    id: session-tokens
    description: >
      JWT tokens and Redis session keys used to maintain authenticated state.
      Theft allows session hijacking without knowing the user's password.
    usage: business
    tags: []
    origin: internal
    owner: VaultNote Team
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: operational
    justification_cia_rating: >
      Session token compromise enables full session hijacking. Short TTLs and
      revocation lists mitigate but do not eliminate the risk.
    pii_categories: [session-identifier]
    data_subject_category: customer
    lawful_basis: contract
    processing_purpose: Session management for authenticated access

technical_assets:

  API Server:
    id: api-server
    description: >
      Node.js/Express REST API. Handles authentication (JWT/bcrypt), CRUD
      on notes, file uploads to MinIO. Bridges the frontend and backend networks.
      Single most security-critical component — compromise equals full data access.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope: ""
    size: service
    technology: web-service-rest
    tags: ["nodejs", "express", "jwt"]
    internet: false
    machine: container
    encryption: none
    owner: VaultNote Team
    confidentiality: confidential
    integrity: critical
    availability: critical
    justification_cia_rating: >
      The API processes all user data. It bridges both Docker networks — a
      compromised API container can pivot into the internal data tier.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    is_pii_processor: true
    is_pii_controller: true
    supported_business_processes:
      - note-creation
      - file-attachment
      - auth-session
    data_assets_processed:
      - user-credentials
      - note-content
      - session-tokens
      - file-attachments
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:

      PostgreSQL Connection:
        target: postgresql-db
        description: >
          Application-level SQL queries for user auth, notes CRUD.
          Uses parameterized queries (pg library) to prevent SQL injection.
          No TLS on the connection — traffic is plaintext within backend-net.
        protocol: sql-access-protocol
        authentication: credentials
        authorization: technical-user
        tags: []
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        # PASTA
        rate_limited: false
        api_style: rest
        # LINDDUN — internal link; no dedicated audit log at the DB wire level
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - user-credentials
          - note-content
        data_assets_received:
          - user-credentials
          - note-content
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

      Redis Session Store:
        target: redis-cache
        description: >
          Session token storage and JWT revocation list.
          Password-protected (requirepass) but no TLS.
        protocol: nosql-access-protocol
        authentication: credentials
        authorization: technical-user
        tags: []
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        # PASTA
        rate_limited: false
        api_style: rest
        # LINDDUN — internal cache link; session operations not individually audit-logged
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - session-tokens
        data_assets_received:
          - session-tokens
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

      MinIO File Storage:
        target: minio-storage
        description: >
          INTENTIONAL MISCONFIGURATION: S3 API calls to MinIO over plain HTTP.
          Default minioadmin/minioadmin credentials are hardcoded in compose.
          Any container on backend-net can read all stored files.
        protocol: http
        authentication: credentials
        authorization: technical-user
        tags: ["intentional-misconfiguration"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        # PASTA
        rate_limited: false
        api_style: rest
        # LINDDUN — plaintext S3 link; no audit logging of file access
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - file-attachments
        data_assets_received:
          - file-attachments
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

trust_boundaries:

  Application Network:
    id: application-network
    description: >
      Internal Docker bridge network (frontend-net). Contains the API server
      which is reachable from Nginx but also bridges into backend-net.
    type: network-on-prem
    tags: []
    technical_assets_inside:
      - api-server
    trust_boundaries_nested: []

risk_tracking:

  # LINDDUN findings on the API server
  detecting-no-audit-logging@api-server:
    status: in-progress
    justification: >
      Structured request/response audit logging (Morgan + Winston) is implemented
      for authenticated endpoints but coverage is incomplete for internal
      data-access events. Full audit trail covering all PII-processing operations
      is tracked in VAULT-116. Target: sprint 23.
    ticket: VAULT-116
    date: 2026-04-25
    checked_by: Security Team

  data-disclosure-pii-unencrypted-link@api-server:
    status: in-progress
    justification: >
      The API server communicates with PostgreSQL, Redis, and MinIO over
      plaintext connections within backend-net. TLS for all internal database
      connections is planned post-launch in VAULT-117. MinIO credential rotation
      is tracked in VAULT-110 (blocker).
    ticket: VAULT-117
    date: 2026-04-25
    checked_by: Security Team

  linking-pii-multi-boundary@api-server:
    status: accepted
    justification: >
      The API server bridges frontend-net and backend-net by architectural
      necessity — it is the sole legitimate data path between the two networks.
      Cross-boundary PII flow is an inherent design characteristic, not a
      misconfiguration. Mitigated by authentication + authorization enforcement
      at the API layer.
    ticket: VAULT-119
    date: 2026-04-25
    checked_by: Security Team

  # PASTA findings on the API server
  custom-development-no-sast@api-server:
    status: in-progress
    justification: >
      SAST tooling (Semgrep with Node.js ruleset) is integrated into the
      GitHub Actions pipeline but the full security rule set is not yet
      enabled. Remaining rule categories (injection, secrets, SSRF) are being
      evaluated for false-positive rates. Target: sprint 21.
    ticket: VAULT-121
    date: 2026-04-25
    checked_by: Security Team

  custom-development-no-sast@browser-spa:
    status: in-progress
    justification: >
      Same Semgrep pipeline as api-server covers the React SPA source.
      ESLint security plugin (eslint-plugin-security) is configured but
      not yet enforced as a blocking check. Planned for sprint 21.
    ticket: VAULT-121
    date: 2026-04-25
    checked_by: Security Team
