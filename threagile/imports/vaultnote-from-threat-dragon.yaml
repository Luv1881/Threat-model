threagile_version: 1.0.0
title: VaultNote Threat Model
business_criticality: archive
data_assets:
    Imported Data (review and classify):
        id: data-imported-td
        description: Stub data asset generated by threat-dragon import. Review confidentiality and PII fields.
        usage: business
        quantity: very-few
        confidentiality: confidential
        integrity: critical
        availability: critical
technical_assets:
    API Server (Node.js/Express):
        id: api-td
        description: REST API handling JWT authentication (bcrypt), notes CRUD, and file upload/download via MinIO. Bridges frontend-net and backend-net — highest-risk pivot point.
        type: process
        usage: business
        size: system
        technology: web-application
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
        communication_links:
            HTTP S3 (9000) ⚠ Unencrypted:
                target: minio-td
                description: 'INTENTIONAL MISCONFIGURATION: S3 API calls over plain HTTP using hardcoded minioadmin credentials. Any container on backend-net can intercept file content and auth tokens.'
                protocol: http
                authentication: none
                authorization: none
                usage: business
            Redis / TCP (6379):
                target: redis-td
                description: Session token read/write and JWT revocation list management. Password-protected but no TLS. Traffic is cleartext within backend-net.
                protocol: http
                authentication: none
                authorization: none
                usage: business
            SQL / TCP (5432):
                target: postgres-td
                description: Application SQL queries for auth and notes CRUD. Uses parameterised queries. No TLS on the connection — plaintext within backend-net.
                protocol: http
                authentication: none
                authorization: none
                usage: business
    Browser (React SPA):
        id: browser-td
        description: React Single Page Application running in the end-user's browser. Handles authentication, note management, and file uploads through the Nginx-fronted API.
        type: external-entity
        usage: business
        used_as_client_by_human: true
        size: system
        technology: client-system
        internet: true
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
        communication_links:
            HTTPS (443):
                target: nginx-td
                description: User-initiated HTTPS requests carrying credentials (login), note content (create/edit), and file uploads. Only encrypted link in the full chain.
                protocol: https
                authentication: none
                authorization: none
                usage: business
    MinIO (Object Storage):
        id: minio-td
        description: S3-compatible object store for user file attachments. Configured with default minioadmin/minioadmin credentials. No encryption at rest or in transit within Docker.
        type: datastore
        usage: business
        size: system
        technology: file-server
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
    Nginx Reverse Proxy:
        id: nginx-td
        description: Terminates TLS on port 443 and reverse-proxies all API traffic to Express over plain HTTP on port 3000. Also serves the static React build. Single external entry point.
        type: process
        usage: business
        size: system
        technology: web-server
        internet: true
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
        communication_links:
            HTTP (3000) ⚠ Unencrypted:
                target: api-td
                description: 'INTENTIONAL MISCONFIGURATION: Nginx forwards all API traffic to Express over plain HTTP. All request data including credentials and session tokens is cleartext within the Docker network.'
                protocol: http
                authentication: none
                authorization: none
                usage: business
    PostgreSQL:
        id: postgres-td
        description: 'Primary relational datastore: users table (email, bcrypt hash), notes, attachments metadata. On backend-net with no direct external exposure.'
        type: datastore
        usage: business
        size: system
        technology: database
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
    Redis (Session Store):
        id: redis-td
        description: In-memory store for active JWT session tokens and revocation list. Password-protected (requirepass) but no TLS. Non-persistent by default.
        type: datastore
        usage: business
        size: system
        technology: database
        machine: virtual
        encryption: none
        confidentiality: confidential
        integrity: critical
        availability: critical
trust_boundaries:
    tb-app:
        id: boundary-tb-app-td
        description: Internal Docker bridge network (frontend-net). Contains the API server which bridges into the data tier.
        type: network-virtual-lan
        technical_assets_inside:
            - api-td
    tb-data:
        id: boundary-tb-data-td
        description: 'Internal Docker bridge network (backend-net, internal: true). No external routing. Contains PostgreSQL, Redis, and MinIO.'
        type: network-virtual-lan
        technical_assets_inside:
            - minio-td
            - postgres-td
            - redis-td
    tb-dmz:
        id: boundary-tb-dmz-td
        description: Demilitarised zone. Contains Nginx reverse proxy. Accessible from internet but isolated from application and data tiers.
        type: network-on-prem
        technical_assets_inside:
            - nginx-td
    tb-internet:
        id: boundary-tb-internet-td
        description: Untrusted external network. All traffic crosses the Nginx TLS termination point before entering the DMZ.
        type: network-on-prem
        technical_assets_inside:
            - browser-td
