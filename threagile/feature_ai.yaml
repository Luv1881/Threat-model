# ============================================================
# Feature: AI/ML — Note Intelligence Layer
# Components: LLM Summarizer, Vector Store, RAG Pipeline
# Networks:   AI Services (internal; LLM endpoint also internet-accessible)
# Rules:      ai-ml pack (inference auth, vector store encryption,
#             prompt injection, RAG filtering, adversarial input)
# ============================================================

technical_assets:

  LLM Note Summarizer:
    id: llm-summarizer
    description: >
      OpenAI-compatible LLM inference endpoint used to generate AI summaries of
      user notes on demand. Deployed as a containerised model proxy (LiteLLM)
      with a public API endpoint for testing.
      INTENTIONAL: Endpoint is internet-accessible and lacks authentication — the
      has-authentication tag is intentionally absent to demonstrate the finding.
      No adversarial input shield (Llama Guard or guardrails) is configured.
      System prompt contains internal business context visible to adversarial probing.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope: ""
    size: service
    technology: llm-inference-endpoint
    tags: ["llm", "ai", "openai", "cloud-native"]
    internet: true
    machine: virtual
    encryption: transparent
    owner: VaultNote Team
    confidentiality: confidential
    integrity: operational
    availability: operational
    justification_cia_rating: >
      LLM endpoint processes user note content. Unauthenticated internet exposure
      allows arbitrary prompt submission, system prompt extraction via jailbreaks,
      and inference cost abuse. No guardrails means malicious inputs could generate
      harmful content or exfiltrate context window data.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    is_pii_processor: true
    is_pii_controller: false
    is_llm_inference: true
    entry_point_type: llm-inference-api
    attack_surface_exposure: internet
    data_assets_processed:
      - note-content
      - ai-model-responses
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:

      Query Vector Store:
        target: vector-store
        description: >
          LLM retrieves relevant note chunks from the vector store to build
          RAG context. Similarity search over user-owned embeddings.
        protocol: https
        authentication: credentials
        authorization: technical-user
        tags: []
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        rate_limited: false
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - embedding-vectors
        data_assets_received:
          - note-content
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

      Call RAG Pipeline:
        target: rag-pipeline
        description: >
          LLM inference endpoint triggers the RAG pipeline to build context
          from stored note embeddings before generating a summary response.
        protocol: https
        authentication: credentials
        authorization: technical-user
        tags: []
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        rate_limited: false
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - note-content
        data_assets_received:
          - note-content
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

  VaultNote Vector Store:
    id: vector-store
    description: >
      Qdrant vector database storing embedding vectors for semantic search and
      RAG context retrieval. Vectors are generated by the embedding service from
      user note content.
      INTENTIONAL: No encryption at rest configured (encryption: none).
      The vector store is queryable by the LLM pipeline and the API server
      without row-level isolation — all user embeddings share the same collection.
      No access control list separates per-user embedding queries.
    type: datastore
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope: ""
    size: service
    technology: vector-store
    tags: ["qdrant", "ai", "embeddings", "information-asset-container", "criticality-high"]
    internet: false
    machine: container
    encryption: none
    owner: VaultNote Team
    confidentiality: confidential
    integrity: operational
    availability: operational
    justification_cia_rating: >
      Embedding vectors encode semantic information from user notes. Even without
      raw text, vectors can be used to infer content via inversion attacks. Unencrypted
      storage and lack of per-user access control create cross-tenant leakage risk.
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    is_pii_processor: true
    is_pii_controller: false
    is_vector_store: true
    data_assets_processed:
      - embedding-vectors
    data_assets_stored:
      - embedding-vectors
    data_formats_accepted:
      - json
    communication_links: {}

  Note RAG Pipeline:
    id: rag-pipeline
    description: >
      Retrieval-Augmented Generation pipeline that assembles context chunks
      from the vector store before forwarding to the LLM. Built on LangChain.
      INTENTIONAL: No input validation or injection guard on retrieved chunks
      (has-input-validation absent). A note containing prompt injection payloads
      could be retrieved as context and alter LLM behavior.
      No retrieval filtering — all results from the vector store are injected
      into context without relevance threshold or content sanitisation.
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope: ""
    size: component
    technology: rag-pipeline
    tags: ["langchain", "ai", "rag"]
    internet: false
    machine: container
    encryption: transparent
    owner: VaultNote Team
    confidentiality: confidential
    integrity: operational
    availability: operational
    justification_cia_rating: >
      RAG pipeline is the injection point between user-controlled note content and
      the LLM context window. Without input validation, a malicious note can manipulate
      the LLM into ignoring instructions, leaking system prompts, or generating
      harmful content on behalf of an attacker.
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    is_pii_processor: true
    is_pii_controller: false
    data_assets_processed:
      - note-content
      - embedding-vectors
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:

      Retrieve from Vector Store:
        target: vector-store
        description: >
          RAG pipeline queries the vector store for nearest-neighbor embeddings
          to build context chunks. Returns raw embedding text — no content filtering
          before injection into LLM context.
        protocol: https
        authentication: credentials
        authorization: technical-user
        tags: []
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        rate_limited: false
        audit_logged: false
        cross_border: false
        data_assets_sent:
          - embedding-vectors
        data_assets_received:
          - note-content
        diagram_tweak_weight: 1
        diagram_tweak_constraint: false

data_assets:

  AI Model Responses:
    id: ai-model-responses
    description: >
      LLM-generated summaries and explanations of user notes. May contain
      paraphrased versions of sensitive note content. Cached temporarily
      in the API response layer.
    usage: business
    tags: ["ai"]
    origin: internal
    owner: VaultNote Team
    quantity: many
    confidentiality: confidential
    integrity: operational
    availability: operational
    justification_cia_rating: >
      LLM responses summarise user note content. If the model was manipulated
      via prompt injection, responses may leak or alter content from other notes.

  Embedding Vectors:
    id: embedding-vectors
    description: >
      High-dimensional vector representations of user note content generated
      by the embedding service. Semantically encodes note information even
      without storing the original text.
    usage: business
    tags: ["ai", "embeddings"]
    origin: internal
    owner: VaultNote Team
    quantity: many
    confidentiality: confidential
    integrity: operational
    availability: operational
    justification_cia_rating: >
      Embedding vectors can be used in model inversion attacks to reconstruct
      approximate original text. Cross-user embedding access leaks semantic note content.
    has_pii: true
    pii_categories: [derived-content-representation]
    data_subject_category: customer
    lawful_basis: contract
    processing_purpose: Semantic search and RAG context assembly

trust_boundaries:

  AI Services:
    id: ai-services
    description: >
      Internal network housing the AI/ML components (vector store, RAG pipeline).
      The LLM inference endpoint is internet-accessible — it is in the Internet
      trust boundary. AI components have outbound access to the vector store and
      receive note content from the API server.
    type: network-on-prem
    tags: ["ai"]
    technical_assets_inside:
      - vector-store
      - rag-pipeline
    trust_boundaries_nested: []

risk_tracking:

  ai-ml-inference-endpoint-no-auth@llm-summarizer:
    status: in-progress
    justification: >
      API key authentication is being added to the LiteLLM proxy. The development
      endpoint is publicly accessible for testing purposes only. Authentication
      enforcement and rate limiting (VAULT-140) are pre-launch requirements.
    ticket: VAULT-137
    date: 2026-04-28
    checked_by: Security Team

  ai-ml-vector-store-no-encryption@vector-store:
    status: in-progress
    justification: >
      Qdrant encryption at rest is available in the Enterprise version. OSS
      deployment will be migrated to Qdrant Cloud (managed) with SSE enabled,
      or wrapped in an encrypted volume. Tracked alongside RDS encryption work.
    ticket: VAULT-138
    date: 2026-04-28
    checked_by: Security Team

  ai-ml-prompt-injection-rag-context@rag-pipeline:
    status: in-progress
    justification: >
      LangChain prompt injection guards (output parsers, system prompt isolation)
      are being evaluated. Interim mitigation: note content is truncated to 500
      tokens before RAG injection. Full input validation (Llama Guard integration)
      is planned for Q3 2026.
    ticket: VAULT-139
    date: 2026-04-28
    checked_by: Security Team

  ai-ml-rag-no-retrieval-filtering@rag-pipeline:
    status: in-progress
    justification: >
      Retrieval filtering (relevance score threshold > 0.7, max 5 chunks) is
      planned for the next sprint. Currently all vector store results are injected
      regardless of similarity score. This creates noise and increases prompt
      injection surface.
    ticket: VAULT-139
    date: 2026-04-28
    checked_by: Security Team

  ai-ml-adversarial-input-no-shield@llm-summarizer:
    status: in-progress
    justification: >
      Llama Guard integration is planned as an input/output shield for the LLM
      endpoint. Currently no adversarial prompt detection or content policy
      enforcement is in place. Pre-launch requirement tracked under VAULT-140.
    ticket: VAULT-140
    date: 2026-04-28
    checked_by: Security Team
