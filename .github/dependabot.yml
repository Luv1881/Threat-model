# Dependency updates for the three surfaces that ship or run here:
# - github-actions: keeps the SHA-pinned workflow actions current (Dependabot
#   understands the `# vX` comment convention and bumps the digest).
# - npm: the API and frontend lockfiles (advisories are reported separately by
#   `npm audit`; Dependabot opens the updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
